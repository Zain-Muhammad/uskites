<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 136" role="img" aria-label="US Kites">
  <!-- Redrawn from the US Kites post artwork. Replace with the original logo file if available. -->
  <!-- left ribbon loop -->
  <path d="M74 44 C 28 52, 26 104, 66 116" fill="none" stroke="#e3121b" stroke-width="7" stroke-linecap="round"/>
  <path d="M84 56 C 50 66, 48 100, 74 108" fill="none" stroke="#0b1f5c" stroke-width="5" stroke-linecap="round"/>
  <!-- kite -->
  <g transform="rotate(-14 136 28)">
    <path d="M136 4 L136 28 L114 28 Z" fill="#e3121b"/>
    <path d="M136 4 L158 28 L136 28 Z" fill="#1e63d6"/>

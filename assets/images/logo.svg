    <text x="62" y="122" font-size="40" fill="#0b1f5c" letter-spacing="1">KITES</text>
  </g>
  <!-- underline swoosh -->
  <path d="M58 129 Q 150 132 238 116" fill="none" stroke="#e3121b" stroke-width="5" stroke-linecap="round"/>
